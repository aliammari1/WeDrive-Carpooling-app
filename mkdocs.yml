site_name: WeDrive Carpooling
site_description: A self-hostable PHP carpooling platform with AI ride-matching and CO2-savings scoring.
site_author: Ali Ammari
repo_url: https://github.com/aliammari1/WeDrive-Carpooling-app
repo_name: aliammari1/WeDrive-Carpooling-app
copyright: Copyright &copy; 2023-2025 Ali Ammari — MIT

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Deployment: deployment.md
  - Architecture: architecture.md
  - Database Schema: schema.md
  - AI Ride Matching: ai-matching.md
  - Security: security.md
