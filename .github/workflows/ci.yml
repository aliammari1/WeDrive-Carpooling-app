name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint + static analysis + style + unit tests across PHP versions.
  # ---------------------------------------------------------------------------
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3"]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wedrive
          MYSQL_USER: wedrive
          MYSQL_PASSWORD: wedrive
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # 2.31.1
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, mysqli, gd, sqlite3, pdo_sqlite, curl, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a # v4.1.2
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax lint (php -l) on all sources
        run: |
          find src tests Model Controller -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: PHPStan (level 3 + baseline)
        run: vendor/bin/phpstan analyse --no-progress

      - name: PHP_CodeSniffer (PSR-12)
        run: vendor/bin/phpcs

      - name: Load schema into MySQL
        run: mysql -h 127.0.0.1 -uroot -proot wedrive < database/schema.sql
        env:
          MYSQL_PWD: root

      - name: PHPUnit
        run: vendor/bin/phpunit --coverage-clover=coverage.xml
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: "3306"
          DB_NAME: wedrive
          DB_USER: wedrive
          DB_PASSWORD: wedrive

      - name: Upload coverage to Codecov
        if: matrix.php == '8.3'
        uses: codecov/codecov-action@0f8570b1a125f4937846a11fcfa3bcd548bd8c97 # v4.6.0
        with:
          files: coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Mutation testing (Infection) on the AI ride-matching + HTTP middleware
  # logic — enforces that the PHPUnit suite actually kills injected bugs, with a
  # minimum mutation score (MSI). Runs on a single PHP version; no DB needed
  # (these suites use the offline providers + temp-file rate limiter).
  # ---------------------------------------------------------------------------
  mutation:
    name: Infection (mutation testing)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup PHP
        uses: shivammathur/setup-php@c541c155eee45413f5b09a52248675b1a2575231 # 2.31.1
        with:
          php-version: "8.3"
          extensions: pdo, sqlite3, pdo_sqlite, curl, mbstring
          coverage: pcov
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Infection (min MSI gate)
        run: |
          vendor/bin/infection \
            --threads=max \
            --min-msi=70 \
            --min-covered-msi=80 \
            --no-progress \
            --logger-github

  # ---------------------------------------------------------------------------
  # Psalm taint / security analysis (the PHP SAST — CodeQL has no PHP support).
  # ---------------------------------------------------------------------------
  psalm-security:
    name: Psalm security analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Psalm (taint analysis -> SARIF)
        uses: psalm/psalm-github-actions@0358ab8948a68b11b5a08eea4ca9b38c3adc59dd # 2.3.2
        with:
          security_analysis: true
          report_file: results.sarif
          composer_require_dev: true

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
        with:
          sarif_file: results.sarif
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Secret scanning — the git history contains hardcoded DB creds.
  # ---------------------------------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Trivy scan of the built PHP image (SHA-pinned per the 2026 tag-hijack note).
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build image
        run: docker build -t wedrive:ci .

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wedrive:ci
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@9887d98ae49f1f598651b556d8c8f02f3ea065cb # v3.27.0
        with:
          sarif_file: trivy.sarif
        continue-on-error: true
