# Pre-commit hooks mirroring CI. Install with: pre-commit install
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # PHP lint + PSR-12 (requires a local PHP + composer install).
  - repo: local
    hooks:
      - id: php-lint
        name: php -l
        entry: php -l
        language: system
        files: \.php$
      - id: phpcs
        name: PHP_CodeSniffer (PSR-12)
        entry: vendor/bin/phpcs
        language: system
        files: ^(src|tests)/.*\.php$
        pass_filenames: false
